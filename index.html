
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi Bạn Thân ❤️</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #c9a7ff);
    overflow: hidden;
    text-align: center;
}

.card {
    background: white;
    padding: 35px 25px;
    border-radius: 25px;
    width: 320px;
    box-shadow: 0 10px 30px #a45a9b55;
    z-index: 2;
}

h1 {
    color: #ff4f9a;
}

p {
    color: #75506c;
    font-size: 18px;
    line-height: 1.7;
}

.heart {
    font-size: 55px;
    animation: beat 1s infinite;
}

button {
    background: #ff69a6;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #e83c86;
}

#message {
    color: #e83c86;
    font-weight: bold;
}

.floating {
    position: absolute;
    bottom: -30px;
    animation: fly 6s linear infinite;
    font-size: 25px;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

@keyframes fly {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">❤️</div>

    <h1>Gửi bạn thân của tôi!</h1>

    <p>
        Này người bạn đặc biệt! 🥰<br>
        Mong bạn luôn vui vẻ,<br>
        luôn mỉm cười mỗi ngày.<br>
        Đừng buồn vì những chuyện không vui nhé!<br>
        Bạn xứng đáng với những điều tốt đẹp nhất.
    </p>

    <button onclick="showMessage()">
        Nhấn vào đây nhé 💌
    </button>

    <p id="message"></p>
</div>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
    "Luôn vui vẻ nhé! Có tôi là bạn thân của bạn đây! 💗🌷";
}

function createHeart() {
    let heart = document.createElement("div");
    heart.className = "floating";
    heart.innerHTML = ["❤️","💕","💗","🌸","✨"][
        Math.floor(Math.random() * 5)
    ];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random()*4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 400);
</script>

</body>
</html>
